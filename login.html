<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Barath Railway</title>
    <link rel="stylesheet" href="index.css">
    <style>
        .auth-container {
            max-width: 400px;
            margin: 60px auto;
            background: rgba(255, 255, 255, 0.07);
            backdrop-filter: blur(16px);
            border: 1px solid rgba(255, 255, 255, 0.15);
            border-radius: 20px;
            padding: 40px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.5);
        }

        .auth-title {
            color: #e0c97f;
            text-align: center;
            margin-bottom: 24px;
            font-size: 24px;
        }

        .form-group {
            margin-bottom: 20px;
        }

        .form-group label {
            display: block;
            color: #aaa;
            margin-bottom: 8px;
            font-size: 14px;
        }

        .form-group input {
            width: 100%;
            padding: 12px;
            background: rgba(255, 255, 255, 0.08);
            border: 1px solid rgba(255, 255, 255, 0.2);
            border-radius: 8px;
            color: #fff;
        }

        .btn {
            width: 100%;
            padding: 12px;
            background: linear-gradient(135deg, #e0c97f, #c8a94a);
            border: none;
            border-radius: 8px;
            font-weight: bold;
            cursor: pointer;
            color: #1a1a2e;
        }

        .btn:hover {
            opacity: 0.9;
        }

        .auth-link {
            text-align: center;
            margin-top: 15px;
            font-size: 14px;
            color: #ccc;
        }

        .auth-link a {
            color: #e0c97f;
            text-decoration: none;
        }

        .error-msg {
            color: #f08090;
            text-align: center;
            margin-bottom: 15px;
            display: none;
        }
    </style>
</head>

<body>
    <div id="user-profile-container"></div>
    <header>
        <h1>BARATH RAILWAY</h1>
        <nav>
            <ul>
                <li><a href="index.html" class="nav-link">Home</a></li>
                <li id="auth-nav"></li>
            </ul>
        </nav>
    </header>
    <main>
        <div class="auth-container">
            <h2 class="auth-title">Login</h2>
            <div id="error-msg" class="error-msg"></div>
            <form id="login-form">
                <div class="form-group">
                    <label>Email Address</label>
                    <input type="email" id="email" required placeholder="Enter your email">
                </div>
                <div class="form-group">
                    <label>Password</label>
                    <input type="password" id="password" required placeholder="Enter password">
                </div>
                <button type="submit" class="btn">Sign In</button>
            </form>
            <div class="auth-link">
                Don't have an account? <a href="register.html">Register here</a>
            </div>
        </div>
    </main>
    <footer>
        <p>&copy; 2026 Barath Railway Booking Platform</p>
    </footer>
    <script>
        // Dynamic API base: empty string (relative) when served via the unified
        // dev-server or ngrok tunnel; absolute URL only as VS Code Live Server fallback.
        const API_URL = (
          (window.location.hostname === 'localhost' || window.location.hostname === '127.0.0.1') &&
          window.location.port === '5500'
        ) ? 'http://localhost:3000' : '';

        document.getElementById('login-form').addEventListener('submit', async (e) => {
            e.preventDefault();
            const email = document.getElementById('email').value;
            const password = document.getElementById('password').value;
            const errorDiv = document.getElementById('error-msg');

            try {
                const res = await fetch(`${API_URL}/api/auth/login`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ email, password })
                });
                const data = await res.json();

                if (!res.ok) throw new Error(data.error || 'Login failed');

                localStorage.setItem('token', data.token);
                localStorage.setItem('user', JSON.stringify({ name: data.name, email: data.email }));

                // Redirect to where they came from or home
                const params = new URLSearchParams(window.location.search);
                window.location.href = params.get('redirect') || 'index.html';

            } catch (err) {
                errorDiv.textContent = err.message;
                errorDiv.style.display = 'block';
            }
        });
    </script>
</body>

</html>
