<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Available Trains - Barath Railway</title>
  <link rel="stylesheet" href="trains.css">
</head>

<body>
  <div id="user-profile-container"></div>
  <header>
    <h1><b>AVAILABLE TRAINS</b></h1>
    <nav>
      <ul>
        <li><a href="index.html" class="nav-link">Home</a></li>
        <li id="nav-trains" class="hidden"><a href="trains.html" class="nav-link active">Trains</a></li>
        <li id="nav-book" class="hidden"><a href="book.html" class="nav-link">Booking</a></li>
        <li id="nav-history" class="hidden"><a href="booking-history.html" class="nav-link">History</a></li>
        <li id="auth-nav"></li>
      </ul>
    </nav>
  </header>
  <main>
    <div class="train-list" id="train-list">
      <!-- Train data will be dynamically inserted here -->
    </div>
  </main>
  <footer>
    <p>&copy; 2026 Barath Railway Booking Platform. All rights reserved.</p>
  </footer>

  <script>
    // Dynamic API base: empty string (relative) when served via the unified
    // dev-server or ngrok tunnel; absolute URL only as VS Code Live Server fallback.
    const API_BASE = (
      (window.location.hostname === 'localhost' || window.location.hostname === '127.0.0.1') &&
      window.location.port === '5500'
    ) ? 'http://localhost:3000/api' : '/api';

    // ── Auth Check & Nav ────────────────────────────────
    const token = localStorage.getItem('token');
    const user = JSON.parse(localStorage.getItem('user') || '{}');
    const authNav = document.getElementById('auth-nav');
    const userProfile = document.getElementById('user-profile-container');
    const navTrains = document.getElementById('nav-trains');
    const navBook = document.getElementById('nav-book');
    const navHistory = document.getElementById('nav-history');

    if (token && user.name) {
      userProfile.innerHTML = `
        <div class="user-profile">
            <span class="user-name">Hi, ${user.name}</span>
            <a href="#" class="logout-link" onclick="logout()">Logout</a>
        </div>
      `;
      authNav.innerHTML = '';
      if (navTrains) navTrains.classList.remove('hidden');
      if (navBook) navBook.classList.remove('hidden');
      if (navHistory) navHistory.classList.remove('hidden');
    } else {
      userProfile.innerHTML = '';
      if (authNav) authNav.innerHTML = `<a href="login.html?redirect=trains.html" class="nav-link">Login</a>`;
      if (navTrains) navTrains.classList.add('hidden');
      if (navBook) navBook.classList.add('hidden');
      if (navHistory) navHistory.classList.add('hidden');
    }

    function logout() {
      localStorage.removeItem('token');
      localStorage.removeItem('user');
      window.location.href = 'index.html';
    }

    async function fetchTrainData() {
      try {
        const res = await fetch(`${API_BASE}/trains`);
        const trains = await res.json();
        const trainList = document.getElementById('train-list');
        trainList.innerHTML = '';

        trains.forEach(train => {
          const trainElement = document.createElement('div');
          trainElement.classList.add('train');
          trainElement.innerHTML = `
                        <div class="train-header">
                            <h2>${train.name}</h2>
                            <span class="route-badge">${train.from} → ${train.to}</span>
                        </div>
                        <div class="train-meta">
                            <span>🕐 Departure: <strong>${train.departure}</strong></span>
                            <span>🕔 Arrival: <strong>${train.arrival}</strong></span>
                        </div>
                        <table>
                            <thead>
                                <tr>
                                    <th>Class</th>
                                    <th>Layout</th>
                                    <th>Available</th>
                                    <th>Action</th>
                                </tr>
                            </thead>
                            <tbody>
                                ${train.seats.map(seat => `
                                    <tr>
                                        <td data-label="Class"><span class="class-badge">${seat.class}</span></td>
                                        <td data-label="Layout">${seat.totalRows} Rows × ${seat.seatsPerRow} Seats</td>
                                        <td data-label="Available" class="${seat.available === 0 ? 'no-seats' : 'has-seats'}">
                                            ${seat.available} / ${seat.total}
                                        </td>
                                        <td data-label="Action">
                                            ${seat.available > 0
              ? `<button class="book-btn" onclick="window.location.href='book.html?train=${train.id}&class=${encodeURIComponent(seat.class)}'">Book</button>`
              : `<span class="sold-out">Sold Out</span>`
            }
                                        </td>
                                    </tr>
                                `).join('')}
                            </tbody>
                        </table>
                    `;
          trainList.appendChild(trainElement);
        });
      } catch (error) {
        console.error('Error fetching train data:', error);
        document.getElementById('train-list').innerHTML = '<p style="color:#f6a623;text-align:center;">Could not load train data.</p>';
      }
    }

    fetchTrainData();
  </script>
</body>

</html>
